# Add to Hermes Agent's config.yaml: %LOCALAPPDATA%\hermes\config.yaml on Windows,
# ~/.hermes/config.yaml on Linux and macOS. If there is already an mcp_servers key, add the entry to it.
mcp_servers:
  methodic:
    command: "python"
    args: ["<path-to-repo>/mcp/server.py"]
    env:
      METHODIC_DATA: "<path-to-data>"
    enabled: true
    timeout: 300          # seconds per tool call
    connect_timeout: 60   # seconds to start and list tools
